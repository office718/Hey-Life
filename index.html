        // Global error handler to catch and display runtime errors on the screen
        window.onerror = function(msg, url, line, col, error) {
            console.error("Global Error:", msg, "at", url, ":", line);
            var errorDiv = document.getElementById('runtime-error-display');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.id = 'runtime-error-display';
                errorDiv.style.position = 'fixed';
                errorDiv.style.bottom = '0';
                errorDiv.style.left = '0';
                errorDiv.style.width = '100%';
                errorDiv.style.background = '#ff4444';
                errorDiv.style.color = 'white';
                errorDiv.style.padding = '15px';
                errorDiv.style.zIndex = '10000';
                errorDiv.style.fontSize = '12px';
                errorDiv.style.fontFamily = 'monospace';
                errorDiv.style.boxShadow = '0 -2px 10px rgba(0,0,0,0.5)';
                document.body.appendChild(errorDiv);
            }
            errorDiv.innerHTML = '<strong>Runtime Error:</strong> ' + msg + '<br/><small>' + url + ':' + line + '</small>';
            return false;
        };
